name: ubuntu

on:
  workflow_dispatch:
  repository_dispatch:
    types: [engine-update]
  push:
    paths:
      - '**'
      - '!.github/**'
      - '!**.yml'
      - '.github/workflows/ubuntu.yml'
      - '!**.md'
      - '!.vscode/**'
      - '!doc/**'

  pull_request:
    paths:
      - '**'
      - '!.github/**'
      - '!**.yml'
      - '.github/workflows/ubuntu.yml'
      - '!**.md'
      - '!.vscode/**'
      - '!doc/**'

env:
  build_type: Release

jobs:
  ubuntu:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Stargus
      uses: actions/checkout@v7
      with:
        submodules: recursive
        path: stargus

    - name: Resolve which Stratagus to build against
      id: stratagus
      run: |
        # The engine and the game are released in lockstep: a tag in this
        # repository has an engine tag of the same name, and a change that spans
        # both repositories is developed on branches of the same name. So look for
        # the same kind of ref as the one we are running on, and build against the
        # engine master branch when the engine does not have it.
        engine=https://github.com/Wargus/stratagus
        # A pull request builds the branch it came from, not the merge ref.
        name=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
        if [ "$GITHUB_REF_TYPE" = tag ]; then
          candidate=refs/tags/$name
        else
          candidate=refs/heads/$name
        fi

        if git ls-remote --exit-code --refs "$engine" "$candidate" > /dev/null; then
          ref=$name
          probe=$candidate
        else
          probe=refs/heads/master
          if ! git ls-remote --exit-code --refs "$engine" "$probe" > /dev/null; then
            echo "Wargus/stratagus has neither $candidate nor $probe" >&2
            exit 1
          fi
          ref=master
        fi
        echo "ref=$ref" >> "$GITHUB_OUTPUT"
        echo "building against Wargus/stratagus@$ref ($probe)"

    - name: Checkout Stratagus
      uses: actions/checkout@v7
      with:
        repository: Wargus/stratagus
        ref: ${{ steps.stratagus.outputs.ref }}
        submodules: recursive
        path: stratagus

    # The engine vendors everything it needs and is picky about what it finds:
    # installing the game packages first drags in system dev packages (tiff,
    # webp, ...) that the vendored SDL2_image builds against but nobody links,
    # so build the engine before installing anything, the way Wargus and War1gus
    # do.
    - name: build Stratagus
      run: |
        cmake -S stratagus -B stratagus/build -DCMAKE_BUILD_TYPE=$build_type -DBUILD_VENDORED_LUA=ON -DBUILD_VENDORED_SDL=ON -DBUILD_VENDORED_MEDIA_LIBS=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        cmake --build stratagus/build --config $build_type

    - name: install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -yy imagemagick meson ninja-build pkg-config \
          libpng-dev zlib1g-dev libmagick++-dev libcppunit-dev nlohmann-json3-dev

    - name: build Stargus with CMake
      run: |
        cmake -S stargus -B stargus/build-cmake -DCMAKE_BUILD_TYPE=$build_type -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DSTRATAGUS=$GITHUB_WORKSPACE/stratagus/build/stratagus -DSTRATAGUS_INCLUDE_DIR=$GITHUB_WORKSPACE/stratagus/gameheaders
        cmake --build stargus/build-cmake --config $build_type

    # Meson cannot use the shared dependencies
    - name: build Stargus with meson
      run: |
        meson setup stargus stargus/build-meson --buildtype=release \
          -DSTRATAGUS_INCLUDE_DIR=$GITHUB_WORKSPACE/stratagus/gameheaders \
          -DSTRATAGUS_BIN=$GITHUB_WORKSPACE/stratagus/build/stratagus
        ninja -C stargus/build-meson
