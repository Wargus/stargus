name: windows

on:
  workflow_dispatch:
  # A manual request to build against the current engine, e.g. with
  # gh api --method POST -f event_type=engine-update repos/Wargus/stargus/dispatches/repository
  repository_dispatch:
    types: [engine-update]
  push:
    # master and version tags only: a push to a branch with a pull request
    # would build what the pull_request event already builds, and a branch
    # that is neither released nor reviewed needs no artifacts of its own.
    branches: [master]
    tags: ['v*', '[0-9]*']
    paths:
      - '**'
      - '!.github/**'
      - '!**.yml'
      - '.github/workflows/windows.yml'
      - '!**.md'
      - '!.vscode/**'
      - '!doc/**'

  pull_request:
    paths:
      - '**'
      - '!.github/**'
      - '!**.yml'
      - '.github/workflows/windows.yml'
      - '!**.md'
      - '!.vscode/**'
      - '!doc/**'

permissions:
  contents: write

env:
  build_type: Release

jobs:
  windows:
    runs-on: windows-latest

    steps:
    - name: Checkout Stargus
      uses: actions/checkout@v7
      with:
        submodules: recursive
        path: stargus

    - name: Resolve which Stratagus to build against
      id: stratagus
      shell: pwsh
      run: |
        # The engine and the game are released in lockstep: a tag in this
        # repository has an engine tag of the same name, and a change that spans
        # both repositories is developed on branches of the same name. So look for
        # the same kind of ref as the one we are running on, and build against the
        # engine master branch when the engine does not have it.
        $engine = 'https://github.com/Wargus/stratagus'
        # A pull request builds the branch it came from, not the merge ref.
        $name = if ($env:GITHUB_HEAD_REF) { $env:GITHUB_HEAD_REF } else { $env:GITHUB_REF_NAME }
        if ($env:GITHUB_REF_TYPE -eq 'tag') {
          $candidate = "refs/tags/$name"
        } else {
          $candidate = "refs/heads/$name"
        }

        foreach ($probe in @($candidate, 'refs/heads/master')) {
          git ls-remote --exit-code --refs $engine $probe | Out-Null
          if ($LASTEXITCODE -eq 0) {
            $ref = $probe -replace '^refs/(heads|tags)/', ''
            "ref=$ref" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "building against Wargus/stratagus@$ref ($probe)"
            return
          }
        }
        throw "Wargus/stratagus has neither $candidate nor refs/heads/master"

    - name: Checkout Stratagus
      uses: actions/checkout@v7
      with:
        repository: Wargus/stratagus
        ref: ${{ steps.stratagus.outputs.ref }}
        submodules: recursive
        path: stratagus

    - name: install NSIS
      shell: pwsh
      run: |
        $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
        if (-not (Test-Path $makensis)) {
          choco install nsis --yes --no-progress
        }
        if (-not (Test-Path $makensis)) {
          throw "did not find makensis.exe at $makensis"
        }
        & $makensis -VERSION

    - name: build Stratagus
      shell: pwsh
      run: |
        cmake -S stratagus -B stratagus/build -DCMAKE_BUILD_TYPE=$env:build_type -DBUILD_VENDORED_LUA=ON -DBUILD_VENDORED_SDL=ON -DBUILD_VENDORED_MEDIA_LIBS=ON "-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
        cmake --build stratagus/build --config $env:build_type

    - name: build Stargus
      shell: pwsh
      run: |
        cmake -S stargus -B stargus/build "-DCMAKE_BUILD_TYPE=$env:build_type" "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" -DENABLE_NSIS=ON "-DSTRATAGUS=../stratagus/build/Release/stratagus.exe" "-DSTRATAGUS_INCLUDE_DIR=../stratagus/gameheaders"
        # stargus.nsi ships the engine it finds next to it, and makensis runs in
        # the build directory.
        Copy-Item stratagus/build/Release/stratagus.exe stargus/build/
        cmake --build stargus/build --config $env:build_type

    - name: collect installers
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        New-Item -ItemType Directory release-assets | Out-Null
        # The installer is named after the game as the NSIS script calls it, which
        # differs in case between the plain and the 64 bit build.
        $installers = @(Get-ChildItem stargus/build -File | Where-Object { $_.Name -like '*gus-*.exe' })
        if ($installers.Count -eq 0) {
          throw 'no NSIS installer was built'
        }
        Copy-Item $installers.FullName -Destination release-assets
        Get-ChildItem release-assets | Format-Table Name, Length

    - name: Upload installers
      uses: actions/upload-artifact@v7
      with:
        name: Stargus-Windows
        path: release-assets/*
        retention-days: 90
        if-no-files-found: error

    - name: Upload to the matching GitHub release
      if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || github.ref_type == 'tag')
      shell: pwsh
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        $ErrorActionPreference = 'Stop'
        if ($env:GITHUB_REF_TYPE -eq 'tag') {
          $tag = $env:GITHUB_REF_NAME
          gh release view $tag --exit-status --json tagName | Out-Null
          $found = $LASTEXITCODE -eq 0
          if (-not $found) {
            gh release create $tag --target $env:GITHUB_SHA --title $tag --notes "Stargus $tag"
          }
        } else {
          $tag = 'master-builds'
        }
        $assets = @(Get-ChildItem release-assets -File | ForEach-Object { $_.FullName })
        gh release upload $tag --clobber $assets
