name: macOS

on:
  workflow_dispatch:
  # Rebuilt when the engine or the shared dependencies move. See the
  # "Downstream builds" workflow in Wargus/stratagus.
  repository_dispatch:
    types: [engine-update]
  push:
    paths:
      - '**'
      - '!.github/**'
      - '!**.yml'
      - '.github/workflows/macos.yml'
      - '!**.md'
      - '!.vscode/**'
      - '!doc/**'

  pull_request:
    paths:
      - '**'
      - '!.github/**'
      - '!**.yml'
      - '.github/workflows/macos.yml'
      - '!**.md'
      - '!.vscode/**'
      - '!doc/**'

jobs:
  macOS:
    strategy:
      matrix:
        include:
            - runner: macos-latest
              suffix: arm64

    runs-on: ${{ matrix.runner}}

    steps:
    - name: Checkout Stargus
      uses: actions/checkout@v7
      with:
        repository: Wargus/stargus
        submodules: recursive
        path: stargus

    - name: Resolve which Stratagus to build against
      id: stratagus
      run: |
        # The engine and the game are released in lockstep: a tag in this
        # repository has an engine tag of the same name, and a change that spans
        # both repositories is developed on branches of the same name. So look for
        # the same kind of ref as the one we are running on, and build against the
        # engine master branch when the engine does not have it.
        engine=https://github.com/Wargus/stratagus
        # A pull request builds the branch it came from, not the merge ref.
        name=${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}
        if [ "$GITHUB_REF_TYPE" = tag ]; then
          candidate=refs/tags/$name
        else
          candidate=refs/heads/$name
        fi

        if git ls-remote --exit-code --refs "$engine" "$candidate" > /dev/null; then
          ref=$name
          probe=$candidate
        else
          probe=refs/heads/master
          if ! git ls-remote --exit-code --refs "$engine" "$probe" > /dev/null; then
            echo "Wargus/stratagus has neither $candidate nor $probe" >&2
            exit 1
          fi
          ref=master
        fi
        echo "ref=$ref" >> "$GITHUB_OUTPUT"
        echo "building against Wargus/stratagus@$ref ($probe)"

    - name: Checkout Stratagus
      uses: actions/checkout@v7
      with:
        repository: Wargus/stratagus
        ref: ${{ steps.stratagus.outputs.ref }}
        submodules: recursive
        path: stratagus

    - name: Install dependencies
      run: brew install dylibbundler imagemagick sdl2 sdl2_mixer sdl2_image lua theora ffmpeg meson

    - name: cmake --version
      run: cmake --version

    - name: Build Stratagus
      run: |
        cmake stratagus -B stratagus/build \
        -DCMAKE_BUILD_TYPE=Release \
        -DCMAKE_FIND_FRAMEWORK=LAST \
        -DBUILD_VENDORED_LUA=ON \
        -DBUILD_VENDORED_SDL=OFF \
        -DBUILD_VENDORED_MEDIA_LIBS=OFF \
        -DBUILD_TESTING=1 \
        -DCMAKE_POLICY_VERSION_MINIMUM=3.5
        cmake --build stratagus/build --config Release

    - name: Build Stargus
      run: |
        meson setup stargus \
        --buildtype=release \
        -DSTRATAGUS_INCLUDE_DIR=../../stratagus/gameheaders \
        -DSTRATAGUS_BIN=../../stratagus/build/stratagus \
        stargus/build
        ninja -C stargus/build

    - name: Create app bundle
      run: |
        export STRATAGUS=stratagus/build/stratagus
        stargus/mac/bundle.sh
        
        dylibbundler -of -cd -b -x stargus/mac/Stargus.app/Contents/MacOS/stratagus -d stargus/mac/Stargus.app/Contents/libs/
        dylibbundler -of -cd -b -x stargus/mac/Stargus.app/Contents/MacOS/startool -d stargus/mac/Stargus.app/Contents/libs/
        
        codesign --force --deep --sign - stargus/mac/Stargus.app
        
    - name: Create .dmg
      run: hdiutil create -volname "Stargus" -srcfolder "stargus/mac/Stargus.app" "Stargus-${{ matrix.suffix }}"
    
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: Stargus-macOS-${{ matrix.suffix }}
        path: Stargus-${{ matrix.suffix }}.dmg
        if-no-files-found: error
